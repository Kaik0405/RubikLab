<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visor 2D del cubo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow">RubikLab</p>
        <h1>Visor 2D del cubo</h1>
      </div>
      <p id="status" class="status" aria-live="polite">Cargando...</p>
    </header>

    <section class="controls" aria-label="Controles del cubo">
      <button id="scrambleButton" type="button">Scramble</button>
      <button id="resetButton" type="button" class="secondary">Reset</button>
      <label for="methodSelect">Método</label>
      <select id="methodSelect">
        <option value="thistle">Thistlethwaite</option>
        <option value="cfop">CFOP</option>
      </select>
      <button id="solveButton" type="button">Solve</button>
      <button id="compareButton" type="button" class="secondary">Comparar</button>
      <button id="benchmarkButton" type="button" class="secondary">Benchmark</button>
      <span id="doubleIndicator" class="double-indicator" aria-live="polite"></span>
    </section>

    <section class="cube-panel" aria-label="Cubo de Rubik desplegado">
      <div id="cube" class="cube-net"></div>
    </section>

    <section class="moves-panel" aria-label="Movimientos del cubo">
      <p class="moves-line"><strong>Movimientos:</strong> <span id="moves">Resuelto</span></p>
      <p class="moves-line"><strong>Solución:</strong> <span id="solutionMoves">—</span></p>
      <p class="help">U R F D L B giran · Shift invierte · 2 aplica doble giro</p>
    </section>

    <section id="solvePanel" class="solve-panel" hidden>
      <h2>Solución</h2>
      <div id="phaseList"></div>
      <p id="solveSummary"></p>
    </section>

    <section id="comparePanel" class="compare-panel" hidden>
      <div class="compare-controls">
        <h2>Comparación</h2>
        <label for="intervalControl">Intervalo: <output id="intervalValue">400</output> ms</label>
        <input id="intervalControl" type="range" min="100" max="1000" step="50" value="400">
      </div>
      <div class="comparison-cubes">
        <article class="comparison-method" id="compareThistle">
          <h3>Thistlethwaite</h3>
          <div class="comparison-cube" id="thistleCube"></div>
          <p class="comparison-stage" id="thistleStage">Pendiente</p>
          <p><span id="thistleCount">0</span> movimientos</p>
        </article>
        <article class="comparison-method" id="compareCfop">
          <h3>CFOP</h3>
          <div class="comparison-cube" id="cfopCube"></div>
          <p class="comparison-stage" id="cfopStage">Pendiente</p>
          <p><span id="cfopCount">0</span> movimientos</p>
        </article>
      </div>
      <div id="compareSummary"></div>
    </section>

    <section id="benchmarkPanel" class="solve-panel" hidden>
      <h2>Benchmark</h2>
      <p id="benchmarkStatus"></p>
      <div id="benchmarkTable"></div>
    </section>

  </main>
  <script src="app.js"></script>
</body>
</html>
