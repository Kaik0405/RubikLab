version: '3'

vars:
  SWIPL: swipl

tasks:
  default:
    desc: Ejecutar la suite de pruebas
    cmds:
      - task: test

  test:
    desc: Ejecutar todas las suites de pruebas de Prolog
    cmds:
      - '{{.SWIPL}} -g "set_test_options([format(log)]),run_tests" -t halt tests/test_cube.pl tests/test_moves.pl tests/test_validation.pl tests/test_facelets.pl tests/test_search.pl tests/test_tables.pl tests/test_thistle.pl tests/test_phase3.pl tests/test_phase4.pl tests/test_server.pl tests/test_oll_pll.pl tests/test_cfop.pl tests/test_explainer.pl tests/test_benchmark.pl'

  test:verbose:
    desc: Ejecutar todas las suites de pruebas de Prolog con salida detallada
    cmds:
      - '{{.SWIPL}} -s tests/test_cube.pl -s tests/test_moves.pl -s tests/test_validation.pl -s tests/test_facelets.pl -s tests/test_search.pl -s tests/test_tables.pl -s tests/test_thistle.pl -s tests/test_phase3.pl -s tests/test_phase4.pl -s tests/test_server.pl -s tests/test_oll_pll.pl -s tests/test_cfop.pl -s tests/test_explainer.pl -s tests/test_benchmark.pl -g "run_tests,halt"'

  test:cube:
    desc: Ejecutar las pruebas del cubo
    cmds:
      - '{{.SWIPL}} -g "set_test_options([format(log)]),run_tests" -t halt tests/test_cube.pl'

  test:moves:
    desc: Ejecutar las pruebas de movimientos
    cmds:
      - '{{.SWIPL}} -g "set_test_options([format(log)]),run_tests" -t halt tests/test_moves.pl'

  test:validation:
    desc: Ejecutar las pruebas de validación
    cmds:
      - '{{.SWIPL}} -g "set_test_options([format(log)]),run_tests" -t halt tests/test_validation.pl'

  test:facelets:
    desc: Ejecutar las pruebas de conversión a facelets
    cmds:
      - '{{.SWIPL}} -g "set_test_options([format(log)]),run_tests" -t halt tests/test_facelets.pl'

  test:search:
    desc: Ejecutar las pruebas de búsqueda IDA*
    cmds:
      - '{{.SWIPL}} -g "set_test_options([format(log)]),run_tests" -t halt tests/test_search.pl'

  test:tables:
    desc: Ejecutar las pruebas de tablas
    cmds:
      - '{{.SWIPL}} -g "set_test_options([format(log)]),run_tests" -t halt tests/test_tables.pl'

  test:thistle:
    desc: Ejecutar las pruebas de la fase 1 de Thistlethwaite
    cmds:
      - '{{.SWIPL}} -g "set_test_options([format(log)]),run_tests" -t halt tests/test_thistle.pl'

  test:phase3:
    desc: Ejecutar las pruebas de la fase 3
    cmds:
      - '{{.SWIPL}} -g "set_test_options([format(log)]),run_tests" -t halt tests/test_phase3.pl'

  test:phase4:
    desc: Ejecutar las pruebas de la fase 4
    cmds:
      - '{{.SWIPL}} -g "set_test_options([format(log)]),run_tests" -t halt tests/test_phase4.pl'

  test:oll_pll:
    desc: Ejecutar las pruebas de oll y pll
    cmds:
      - '{{.SWIPL}} -g "set_test_options([format(log)]),run_tests" -t halt tests/test_oll_pll.pl'

  test:cfop:
    desc: Ejecutar las pruebas de CFOP
    cmds:
      - '{{.SWIPL}} -g "set_test_options([format(log)]),run_tests" -t halt tests/test_cfop.pl'

  test:explainer:
    desc: Ejecutar las pruebas del explicador
    cmds:
      - '{{.SWIPL}} -g "set_test_options([format(log)]),run_tests" -t halt tests/test_explainer.pl'

  test:benchmark:
    desc: Ejecutar las pruebas del benchmark
    cmds:
      - '{{.SWIPL}} -g "set_test_options([format(log)]),run_tests" -t halt tests/test_benchmark.pl'

  test:server:
    desc: Ejecutar las pruebas puras del servidor
    cmds:
      - '{{.SWIPL}} -g "set_test_options([format(log)]),run_tests" -t halt tests/test_server.pl'

  check:
    desc: Cargar el módulo del cubo y verificar su sintaxis
    cmds:
      - '{{.SWIPL}} -q -g "[prolog/cube],halt"'

  server:
    desc: Iniciar el servidor de Prolog
    cmds:
      - '{{.SWIPL}} -q -s prolog/server.pl -g "server:start,thread_get_message(_)"'

  benchmark:
    desc: Ejecutar el benchmark de Prolog
    cmds:
      - '{{.SWIPL}} -s prolog/benchmark.pl'