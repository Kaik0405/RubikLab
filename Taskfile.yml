version: '3'

vars:
  SWIPL: swipl

tasks:
  default:
    desc: Ejecutar la suite de pruebas
    cmds:
      - task: test

  test:
    desc: Ejecutar todas las suites de pruebas de Prolog
    cmds:
      - '{{.SWIPL}} -g "set_test_options([format(log)]),run_tests" -t halt tests/test_cube.pl tests/test_moves.pl tests/test_validation.pl tests/test_facelets.pl'

  test:verbose:
    desc: Ejecutar todas las suites de pruebas de Prolog con salida detallada
    cmds:
      - '{{.SWIPL}} -s tests/test_cube.pl -s tests/test_moves.pl -s tests/test_validation.pl -s tests/test_facelets.pl -g "run_tests,halt"'

  test:cube:
    desc: Ejecutar las pruebas del cubo
    cmds:
      - '{{.SWIPL}} -g "set_test_options([format(log)]),run_tests" -t halt tests/test_cube.pl'

  test:moves:
    desc: Ejecutar las pruebas de movimientos
    cmds:
      - '{{.SWIPL}} -g "set_test_options([format(log)]),run_tests" -t halt tests/test_moves.pl'

  test:validation:
    desc: Ejecutar las pruebas de validación
    cmds:
      - '{{.SWIPL}} -g "set_test_options([format(log)]),run_tests" -t halt tests/test_validation.pl'

  test:facelets:
    desc: Ejecutar las pruebas de conversión a facelets
    cmds:
      - '{{.SWIPL}} -g "set_test_options([format(log)]),run_tests" -t halt tests/test_facelets.pl'

  check:
    desc: Cargar el módulo del cubo y verificar su sintaxis
    cmds:
      - '{{.SWIPL}} -q -g "[prolog/cube],halt"'

  server:
    desc: Iniciar el servidor de Prolog
    cmds:
      - '{{.SWIPL}} -q -s prolog/server.pl -g "server:start,thread_get_message(_)"'

  benchmark:
    desc: Ejecutar el benchmark de Prolog
    cmds:
      - '{{.SWIPL}} -s prolog/benchmark.pl'